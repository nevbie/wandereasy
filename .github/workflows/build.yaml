name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Prüfen und APK bauen
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Abhängigkeiten
        run: |
          flutter --version
          flutter pub get
          flutter gen-l10n

      - name: Formatierung prüfen
        run: dart format --output=none --set-exit-if-changed $(git ls-files '*.dart')

      - name: Analyse
        run: flutter analyze

      - name: Tests
        run: flutter test

      - name: Release-Schlüssel einrichten (falls vorhanden)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Kein Keystore-Secret gesetzt – APK wird mit Debug-Schlüssel signiert."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          cat > android/key.properties <<PROPS
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS

      - name: APK bauen
        env:
          TRANSIT_PROVIDER: ${{ vars.TRANSIT_PROVIDER || 'mock' }}
          MAP_STYLE_URL: ${{ secrets.MAP_STYLE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=TRANSIT_PROVIDER="$TRANSIT_PROVIDER" \
            --dart-define=MAP_STYLE_URL="$MAP_STYLE_URL" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: wandern-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Schlüssel aufräumen
        if: always()
        run: rm -f android/app/release.jks android/key.properties
